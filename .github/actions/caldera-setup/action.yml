name: "Caldera Setup"
description: "Set up Python 3.12, project venv, and optionally tool environments"

inputs:
  setup-tools:
    description: "Also set up tool venvs and binaries (slower)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-

    - name: Cache project venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: core-venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

    - name: Set up project venv
      shell: bash
      run: make setup-core

    - name: Set up Java 17 (for pmd-cpd)
      if: inputs.setup-tools == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up .NET 8.0 (for roslyn-analyzers, devskim, dotcover)
      if: inputs.setup-tools == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Install DevSkim CLI
      if: inputs.setup-tools == 'true'
      shell: bash
      run: |
        dotnet tool install --global Microsoft.CST.DevSkim.CLI
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Install Trivy
      if: inputs.setup-tools == 'true'
      shell: bash
      run: |
        sudo apt-get install -y wget apt-transport-https gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Cache tool venvs
      if: inputs.setup-tools == 'true'
      uses: actions/cache@v4
      with:
        path: src/tools/*/.venv
        key: tool-venvs-${{ runner.os }}-${{ hashFiles('src/tools/*/requirements.txt') }}

    - name: Cache tool binaries
      if: inputs.setup-tools == 'true'
      uses: actions/cache@v4
      with:
        path: |
          src/tools/scc/bin
          src/tools/git-sizer/bin
          src/tools/gitleaks/bin
        key: tool-bins-${{ runner.os }}-${{ hashFiles('src/tools/*/Makefile') }}

    - name: Cache PMD binary
      if: inputs.setup-tools == 'true'
      uses: actions/cache@v4
      with:
        path: src/tools/pmd-cpd/.pmd
        key: pmd-${{ runner.os }}-${{ hashFiles('src/tools/pmd-cpd/Makefile') }}

    - name: Set up tool environments
      if: inputs.setup-tools == 'true'
      shell: bash
      run: make tools-setup
