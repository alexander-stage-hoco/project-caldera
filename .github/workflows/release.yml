name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          {
            echo "CHANGELOG<<'CHANGELOGEOF'"
            echo "## What's Changed"
            echo ""
            for prefix in "Add" "Fix" "Update"; do
              COMMITS=$(git log --oneline "$RANGE" --grep="^${prefix}" --format="- %s" 2>/dev/null || true)
              if [ -n "$COMMITS" ]; then
                echo "### ${prefix}"
                echo "$COMMITS"
                echo ""
              fi
            done
            OTHER=$(git log --oneline "$RANGE" --format="- %s" | grep -v -E '^- (Add|Fix|Update)' || true)
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            fi
            echo "CHANGELOGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.changelog.outputs.CHANGELOG }}"
