name: "Gate 0 — Preflight"

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "tool/**"
      - "infra/**"

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Compliance Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/caldera-setup

      - name: Run compliance preflight
        run: make compliance-preflight
