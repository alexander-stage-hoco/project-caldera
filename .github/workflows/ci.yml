name: "CI Pipeline"

on:
  pull_request:
    branches: [develop, release, main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Tools to skip in smoke tests (sonarqube needs a running Docker server)
env:
  CI_SKIP_TOOLS: "sonarqube"

jobs:
  # ── Gate A — Fast Quality (always runs) ──────────────────────────────────
  quality:
    name: "Gate A — Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/caldera-setup

      - name: Compliance preflight
        run: make compliance-preflight

      - name: Core unit tests (fast)
        run: .venv/bin/python -m pytest -m "not slow and not integration" --tb=short -q

      - name: Observability compliance
        run: .venv/bin/python scripts/check_observability_compliance.py

  # ── Gate B — Compliance Report (release, main) ───────────────────────────
  compliance-report:
    name: "Gate B — Compliance Report"
    if: github.base_ref == 'release' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/caldera-setup

      - name: Compliance gate (preflight — must pass)
        run: make compliance-preflight

      - name: Full compliance report (informational)
        continue-on-error: true
        run: make compliance COMPLIANCE_OUT_JSON=ci_artifacts/compliance_report.json COMPLIANCE_OUT_MD=ci_artifacts/compliance_report.md

      - name: Upload compliance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: ci_artifacts/
          retention-days: 30

  # ── Gate C — Production Smoke (release) ──────────────────────────────────
  # Runs LOCAL and BUNDLE modes sequentially in a single job to avoid
  # duplicating ~3-5 min of setup (checkout, Python, venv, tool binaries).
  prod-smoke:
    name: "Gate C — Production Smoke"
    if: github.base_ref == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/caldera-setup
        with:
          setup-tools: "true"

      # ── LOCAL mode ──────────────────────────────────────────────────────
      - name: Run pipeline (LOCAL mode, LLM off)
        run: |
          make pipeline-eval \
            ORCH_REPO_PATH=${{ github.workspace }}/tests/fixtures/ci-repo \
            PIPELINE_LLM=0 \
            SKIP_TOOLS=${{ env.CI_SKIP_TOOLS }} \
            CONTINUE_ON_TOOL_FAILURE=1

      - name: Verify LOCAL report exists
        run: |
          REPORT=$(find src/insights/output/pipeline -name "report.html" -type f | head -1)
          if [ -z "$REPORT" ]; then
            echo "ERROR: report.html not found"
            exit 1
          fi
          SIZE=$(stat -c%s "$REPORT" 2>/dev/null || stat -f%z "$REPORT" 2>/dev/null)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: report.html is too small ($SIZE bytes)"
            exit 1
          fi
          echo "OK: LOCAL report.html exists ($SIZE bytes)"

      - name: Check LOCAL trust score + warning budget
        run: |
          WARNINGS=$(find src/insights/output/pipeline -name "warnings.json" -type f | head -1)
          WARN_FLAG=""
          if [ -n "$WARNINGS" ]; then
            WARN_FLAG="--check-warnings $WARNINGS"
          fi
          .venv/bin/python scripts/check_run_quality.py --db ~/.caldera/caldera_sot.duckdb --min-trust 50 $WARN_FLAG

      - name: Clean DB for BUNDLE mode
        run: make clean-db

      # ── BUNDLE mode ─────────────────────────────────────────────────────
      - name: Collect artifacts
        run: |
          .venv/bin/python scripts/collect_artifacts.py \
            --repo-path tests/fixtures/ci-repo \
            --repo-id ci-sample \
            --run-id ci-run \
            --skip-tools "${{ env.CI_SKIP_TOOLS }}"

      - name: Ingest bundle and generate report
        run: |
          make analyze-bundle \
            REPO=tests/fixtures/ci-repo \
            BUNDLE=artifacts/ci-sample/ci-run \
            PIPELINE_LLM=0

      - name: Verify BUNDLE report exists
        run: |
          REPORT=$(find src/insights/output/pipeline -name "report.html" -type f | head -1)
          if [ -z "$REPORT" ]; then
            echo "ERROR: report.html not found"
            exit 1
          fi
          SIZE=$(stat -c%s "$REPORT" 2>/dev/null || stat -f%z "$REPORT" 2>/dev/null)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: report.html is too small ($SIZE bytes)"
            exit 1
          fi
          echo "OK: BUNDLE report.html exists ($SIZE bytes)"

      - name: Check BUNDLE trust score + warning budget
        run: |
          WARNINGS=$(find src/insights/output/pipeline -name "warnings.json" -type f | head -1)
          WARN_FLAG=""
          if [ -n "$WARNINGS" ]; then
            WARN_FLAG="--check-warnings $WARNINGS"
          fi
          .venv/bin/python scripts/check_run_quality.py --db ~/.caldera/caldera_sot.duckdb --min-trust 50 $WARN_FLAG

  # ── Promotion Policy (main only) ───────────────────────────────────────
  promotion-check:
    name: "Promotion Policy"
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "release" ]; then
            echo "ERROR: PRs to main must come from release branch"
            echo "Current source: ${{ github.head_ref }}"
            exit 1
          fi
