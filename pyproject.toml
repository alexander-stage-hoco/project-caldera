[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caldera"
version = "0.13.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "duckdb>=1.0.0",
]

[project.scripts]
caldera = "caldera_cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["caldera_cli*"]
